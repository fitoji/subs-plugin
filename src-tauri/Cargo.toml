[package]
name = "subtitle-overlay"
version = "0.2.1"
description = "Subtitle Overlay for macOS — transparent always-on-top subtitles"
authors = ["you"]
edition = "2021"

[lib]
name = "subtitle_overlay_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time", "process"] }
screencapturekit = { version = "8", features = ["macos_13_0"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
toml = "0.8"
dirs = "5"
